[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mvfs-lab"
version = "0.1.0"
description = "Monorepo framework for UIMUFSLR, TERUIMUFS and future multi-view feature selection projects"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "scikit-learn>=1.0.0",
    "h5py>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "mvfs_core*",
    "uimufslr*",
    "teruimufs*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]